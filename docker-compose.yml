services:
  db:
    image: postgres:16
    container_name: tasks_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_manager
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: tasks_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/task_manager
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    container_name: tasks_frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

  export:
    build: ./python
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/task_manager
    volumes:
      - ./python:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
